<!DOCTYPE html>

    <head>
        <title>Timeline Demo</title>
        <meta charset="utf-8">
        <link rel="stylesheet" type="text/css" href="main.css">
        <style>
            body {
                background: #1a1a1a;
                font-family: -apple-system, BlinkMacSystemFont, sans-serif;
                color: #ccc;
            }
        </style>
    </head>
    <body>
        <div data-layout="vertical" data-fill style="background: #252525;">

            <!-- 上：固定高度 -->
            <div data-height="12%" style="background: #000;"></div>

            <!-- 中：自動延展 -->
            <div data-flex="1">
                <!-- 你的內容 -->
                <div data-timeline data-height="120px" data-bottom="12%"></div>


            </div>

            <!-- 下：百分比高度 -->
            <div data-height="12%" style="background: #000;"></div>

        </div>
