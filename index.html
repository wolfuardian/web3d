<!DOCTYPE html>
<html lang="zh-TW">
    <head>
        <meta charset="UTF-8">
        <title>Panel Editor v2</title>
        <style>
            * { margin: 0; padding: 0; box-sizing: border-box; }
            body { background: #1a1a2e; height: 100vh; overflow: hidden; font-family: sans-serif; }

            /* 頂部工具列 */
            #toolbar {
                position: fixed;
                top: 10px;
                left: 10px;
                z-index: 1000;
                display: flex;
                gap: 8px;
            }
            #toolbar button {
                padding: 8px 16px;
                background: #16213e;
                color: #fff;
                border: 1px solid #0f3460;
                cursor: pointer;
                font-size: 12px;
            }
            #toolbar button:hover { background: #0f3460; }

            /* 畫布 */
            #canvas {
                width: calc(100% - 250px);
                height: 100%;
            }

            /* Panel 基礎樣式 */
            .panel {
                position: absolute;
                background: rgba(15, 52, 96, 0.9);
                border: 1px solid #00d9ff;
                cursor: move;
                min-width: 50px;
                min-height: 50px;
                resize: both;
                overflow: hidden;
            }
            .panel.selected {
                border-color: #ff0055;
                box-shadow: 0 0 10px #ff0055;
            }
            .panel-header {
                background: rgba(0, 217, 255, 0.2);
                padding: 4px 8px;
                font-size: 12px;
                color: #00d9ff;
                user-select: none;
                display: flex;
                justify-content: space-between;
            }
            .panel-type {
                opacity: 0.6;
                font-size: 10px;
            }
            .panel-content {
                width: 100%;
                height: calc(100% - 24px);
                display: flex;
                align-items: center;
                justify-content: center;
                color: #666;
                font-size: 12px;
            }
            .panel-content img {
                width: 100%;
                height: 100%;
                object-fit: cover;
            }
            .panel-content.text-content {
                padding: 8px;
                color: #fff;
                align-items: flex-start;
                justify-content: flex-start;
                white-space: pre-wrap;
            }

            /* 浮動工具列 */
            #float-toolbar {
                position: absolute;
                display: none;
                gap: 4px;
                background: #16213e;
                border: 1px solid #0f3460;
                padding: 4px;
                border-radius: 4px;
                z-index: 999;
            }
            #float-toolbar button {
                width: 28px;
                height: 28px;
                background: #0f3460;
                border: none;
                color: #fff;
                cursor: pointer;
                border-radius: 3px;
                font-size: 14px;
            }
            #float-toolbar button:hover { background: #00d9ff; color: #000; }
            #float-toolbar button.active { background: #ff0055; }

            /* 側邊編輯面板 */
            #side-panel {
                position: fixed;
                right: 0;
                top: 0;
                width: 250px;
                height: 100%;
                background: #16213e;
                border-left: 1px solid #0f3460;
                padding: 16px;
                color: #fff;
                font-size: 12px;
                overflow-y: auto;
            }
            #side-panel h3 {
                margin-bottom: 16px;
                color: #00d9ff;
                font-size: 14px;
            }
            #side-panel .field {
                margin-bottom: 12px;
            }
            #side-panel label {
                display: block;
                margin-bottom: 4px;
                color: #888;
            }
            #side-panel input, #side-panel textarea {
                width: 100%;
                padding: 6px;
                background: #0f3460;
                border: 1px solid #00d9ff;
                color: #fff;
                font-size: 12px;
            }
            #side-panel textarea {
                min-height: 80px;
                resize: vertical;
            }
            #side-panel .empty {
                color: #666;
                text-align: center;
                margin-top: 40px;
            }
        </style>
    </head>
    <body>

        <div id="toolbar">
            <button onclick="addPanel()">+ 新增 Panel</button>
            <button onclick="exportJSON()">匯出 JSON</button>
            <button onclick="importJSON()">匯入 JSON</button>
            <button onclick="deleteSelected()">刪除選取</button>
        </div>

        <!-- 浮動工具列 -->
        <div id="float-toolbar">
            <button onclick="convertTo('panel')" title="Panel">▢</button>
            <button onclick="convertTo('image')" title="Image">🖼</button>
            <button onclick="convertTo('text')" title="Text">T</button>
            <button onclick="convertTo('layout')" title="Layout Group">⊞</button>
        </div>

        <div id="canvas"></div>

        <!-- 側邊編輯面板 -->
        <div id="side-panel">
            <div class="empty">選取 Panel 以編輯</div>
        </div>

        <script>
            const canvas = document.getElementById('canvas')
            const floatToolbar = document.getElementById('float-toolbar')
            const sidePanel = document.getElementById('side-panel')

            let panelCount = 0
            let selectedPanel = null
            let componentsData = {}  // id -> { type, styles, props }

            // 各類型預設 props
            const defaultProps = {
                panel: {},
                image: { src: '' },
                text: { content: '輸入文字...' },
                layout: { children: [] }
            }

            // 新增 Panel
            function addPanel() {
                panelCount++
                const id = `panel-${panelCount}`

                componentsData[id] = {
                    type: 'panel',
                    styles: { left: '100px', top: '100px', width: '200px', height: '150px' },
                    props: { ...defaultProps.panel }
                }

                renderPanel(id)
            }

            // 渲染單個 Panel
            function renderPanel(id) {
                const data = componentsData[id]

                // 移除舊的
                const old = document.getElementById(id)
                if (old) old.remove()

                const panel = document.createElement('div')
                panel.className = 'panel'
                panel.id = id
                Object.assign(panel.style, data.styles)

                // Header
                const header = document.createElement('div')
                header.className = 'panel-header'
                header.innerHTML = `<span>${id}</span><span class="panel-type">${data.type}</span>`
                panel.appendChild(header)

                // Content
                const content = document.createElement('div')
                content.className = 'panel-content'

                switch (data.type) {
                    case 'image':
                        if (data.props.src) {
                            content.innerHTML = `<img src="${data.props.src}" alt="">`
                        } else {
                            content.textContent = '拖放圖片或輸入 URL'
                        }
                        break
                    case 'text':
                        content.className += ' text-content'
                        content.textContent = data.props.content || ''
                        break
                    case 'layout':
                        content.textContent = 'Layout Group'
                        content.style.border = '1px dashed #00d9ff'
                        break
                    default:
                        content.textContent = ''
                }

                panel.appendChild(content)
                canvas.appendChild(panel)

                makeDraggable(panel)
                makeSelectable(panel)
                setupImageDrop(panel)
            }

            // 拖拉功能
            function makeDraggable(el) {
                const header = el.querySelector('.panel-header')
                let offsetX, offsetY

                header.onmousedown = e => {
                    if (e.target !== header && !header.contains(e.target)) return
                    offsetX = e.clientX - el.offsetLeft
                    offsetY = e.clientY - el.offsetTop

                    document.onmousemove = e => {
                        el.style.left = (e.clientX - offsetX) + 'px'
                        el.style.top = (e.clientY - offsetY) + 'px'
                        updateFloatToolbar()
                        syncStyles(el)
                    }
                    document.onmouseup = () => {
                        document.onmousemove = null
                    }
                }
            }

            // 同步 styles 到 data
            function syncStyles(el) {
                const id = el.id
                componentsData[id].styles = {
                    left: el.style.left,
                    top: el.style.top,
                    width: el.style.width || el.offsetWidth + 'px',
                    height: el.style.height || el.offsetHeight + 'px'
                }
            }

            // 選取功能
            function makeSelectable(el) {
                el.onclick = e => {
                    e.stopPropagation()
                    selectPanel(el)
                }
            }

            function selectPanel(el) {
                document.querySelectorAll('.panel').forEach(p => p.classList.remove('selected'))
                el.classList.add('selected')
                selectedPanel = el
                updateFloatToolbar()
                updateSidePanel()
            }

            // 點空白處取消選取
            canvas.onclick = () => {
                document.querySelectorAll('.panel').forEach(p => p.classList.remove('selected'))
                selectedPanel = null
                floatToolbar.style.display = 'none'
                sidePanel.innerHTML = '<div class="empty">選取 Panel 以編輯</div>'
            }

            // 更新浮動工具列位置
            function updateFloatToolbar() {
                if (!selectedPanel) {
                    floatToolbar.style.display = 'none'
                    return
                }

                const rect = selectedPanel.getBoundingClientRect()
                floatToolbar.style.display = 'flex'
                floatToolbar.style.left = rect.left + 'px'
                floatToolbar.style.top = (rect.top - 40) + 'px'

                // 更新 active 狀態
                const type = componentsData[selectedPanel.id].type
                floatToolbar.querySelectorAll('button').forEach(btn => {
                    btn.classList.toggle('active', btn.getAttribute('title').toLowerCase() === type)
                })
            }

            // 轉換類型
            function convertTo(newType) {
                if (!selectedPanel) return

                const id = selectedPanel.id
                const data = componentsData[id]

                if (data.type === newType) return

                data.type = newType
                data.props = { ...defaultProps[newType] }

                renderPanel(id)

                // 重新選取
                const newEl = document.getElementById(id)
                selectPanel(newEl)
            }

            // 更新側邊面板
            function updateSidePanel() {
                if (!selectedPanel) return

                const id = selectedPanel.id
                const data = componentsData[id]

                let html = `<h3>編輯: ${id}</h3>`

                switch (data.type) {
                    case 'image':
                        html += `
        <div class="field">
          <label>圖片 URL</label>
          <input type="text" id="prop-src" value="${data.props.src || ''}"
                 onchange="updateProp('src', this.value)"
                 placeholder="https://...">
        </div>
        <div class="field">
          <label>或拖放圖片到 Panel</label>
        </div>
      `
                        break
                    case 'text':
                        html += `
        <div class="field">
          <label>文字內容</label>
          <textarea id="prop-content"
                    onchange="updateProp('content', this.value)">${data.props.content || ''}</textarea>
        </div>
      `
                        break
                    case 'layout':
                        html += `
        <div class="field">
          <label>子元件數量</label>
          <span>${(data.props.children || []).length}</span>
        </div>
      `
                        break
                    default:
                        html += `<div class="empty">基礎 Panel 無額外屬性</div>`
                }

                // 通用樣式
                html += `
    <h3 style="margin-top: 20px;">位置與尺寸</h3>
    <div class="field">
      <label>Left</label>
      <input type="text" value="${data.styles.left}" onchange="updateStyle('left', this.value)">
    </div>
    <div class="field">
      <label>Top</label>
      <input type="text" value="${data.styles.top}" onchange="updateStyle('top', this.value)">
    </div>
    <div class="field">
      <label>Width</label>
      <input type="text" value="${data.styles.width}" onchange="updateStyle('width', this.value)">
    </div>
    <div class="field">
      <label>Height</label>
      <input type="text" value="${data.styles.height}" onchange="updateStyle('height', this.value)">
    </div>
  `

                sidePanel.innerHTML = html
            }

            // 更新 prop
            function updateProp(key, value) {
                if (!selectedPanel) return
                const id = selectedPanel.id
                componentsData[id].props[key] = value
                renderPanel(id)
                selectPanel(document.getElementById(id))
            }

            // 更新 style
            function updateStyle(key, value) {
                if (!selectedPanel) return
                const id = selectedPanel.id
                componentsData[id].styles[key] = value
                selectedPanel.style[key] = value
                updateFloatToolbar()
            }

            // 圖片拖放
            function setupImageDrop(panel) {
                panel.ondragover = e => e.preventDefault()
                panel.ondrop = e => {
                    e.preventDefault()
                    const id = panel.id
                    const data = componentsData[id]

                    if (data.type !== 'image') {
                        convertTo('image')
                    }

                    const file = e.dataTransfer.files[0]
                    if (file && file.type.startsWith('image/')) {
                        const reader = new FileReader()
                        reader.onload = evt => {
                            componentsData[id].props.src = evt.target.result
                            renderPanel(id)
                            selectPanel(document.getElementById(id))
                        }
                        reader.readAsDataURL(file)
                    }
                }
            }

            // 刪除選取
            function deleteSelected() {
                if (selectedPanel) {
                    delete componentsData[selectedPanel.id]
                    selectedPanel.remove()
                    selectedPanel = null
                    floatToolbar.style.display = 'none'
                    sidePanel.innerHTML = '<div class="empty">選取 Panel 以編輯</div>'
                }
            }

            // 匯出 JSON
            function exportJSON() {
                // 同步所有 panel 的最新 styles
                document.querySelectorAll('.panel').forEach(el => syncStyles(el))

                const data = {
                    components: Object.entries(componentsData).map(([id, d]) => ({
                        id,
                        type: d.type,
                        styles: d.styles,
                        props: d.props
                    }))
                }

                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' })
                const a = document.createElement('a')
                a.href = URL.createObjectURL(blob)
                a.download = 'layout.json'
                a.click()
            }

            // 匯入 JSON
            function importJSON() {
                const input = document.createElement('input')
                input.type = 'file'
                input.accept = '.json'
                input.onchange = async e => {
                    const file = e.target.files[0]
                    const text = await file.text()
                    const data = JSON.parse(text)

                    // 清空
                    canvas.querySelectorAll('.panel').forEach(p => p.remove())
                    componentsData = {}
                    panelCount = 0
                    selectedPanel = null
                    floatToolbar.style.display = 'none'

                    // 重建
                    data.components.forEach(c => {
                        const num = parseInt(c.id.split('-')[1]) || 0
                        if (num > panelCount) panelCount = num

                        componentsData[c.id] = {
                            type: c.type,
                            styles: c.styles,
                            props: c.props
                        }
                        renderPanel(c.id)
                    })
                }
                input.click()
            }

            // 鍵盤刪除
            document.onkeydown = e => {
                if (e.key === 'Delete' || e.key === 'Backspace') {
                    if (document.activeElement.tagName !== 'INPUT' &&
                        document.activeElement.tagName !== 'TEXTAREA') {
                        deleteSelected()
                    }
                }
            }

            // 監聽 resize
            new ResizeObserver(() => {
                if (selectedPanel) {
                    syncStyles(selectedPanel)
                    updateFloatToolbar()
                    updateSidePanel()
                }
            }).observe(document.body)
        </script>

    </body>
</html>
