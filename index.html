<!DOCTYPE html>
<html lang="zh-TW">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Slider Components</title>
        <style>
            * { box-sizing: border-box; margin: 0; padding: 0; }

            body {
                font-family: system-ui, sans-serif;
                background: #0f0f1a;
                color: #eee;
                min-height: 100vh;
                padding: 48px;
            }

            h1 {
                color: #6366f1;
                margin-bottom: 32px;
            }

            .links {
                display: flex;
                flex-direction: column;
                gap: 16px;
            }

            a {
                display: block;
                padding: 20px 24px;
                background: #1a1a2e;
                border: 1px solid #2a2a3e;
                border-radius: 8px;
                color: #eee;
                text-decoration: none;
                transition: background 0.2s, border-color 0.2s;
            }

            a:hover {
                background: #252540;
                border-color: #6366f1;
            }

            a .title {
                font-size: 18px;
                font-weight: 600;
                margin-bottom: 4px;
            }

            a .desc {
                font-size: 13px;
                color: #888;
            }
        </style>
    </head>
    <body>
        <h1>Slider Components</h1>
        <div class="links">
            <a href="slider-demo.html">
                <div class="title">Nested Group Sliders</div>
                <div class="desc">巢狀 horizontal/vertical group 結構內的可拖曳 slider</div>
            </a>
            <a href="range-slider.html">
                <div class="title">Range Slider</div>
                <div class="desc">頭尾可拖曳、可整體移動的範圍選擇器</div>
            </a>
            <a href="touch-drag.html">
                <div class="title">Touch Drag Utility</div>
                <div class="desc">使用 Pointer Events 統一處理 mouse + touch 拖曳</div>
            </a>
            <a href="timeline.html">
                <div class="title">Timeline Component</div>
                <div class="desc">Range + Playhead 組合，播放頭限制在選取範圍內</div>
            </a>
        </div>
    </body>
</html>
