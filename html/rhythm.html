<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title><!DOCTYPE html>
        <html lang="zh-TW">
        <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>文字冒險遊戲</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #2c3e50;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .game-container {
            background-color: #34495e;
            border-radius: 10px;
            padding: 30px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        #story {
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 30px;
            min-height: 100px;
        }

        .button-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        button {
            padding: 15px;
            font-size: 16px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #2980b9;
        }

        button:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>
<div class="game-container">
    <div id="story">歡迎來到冒險世界!你站在一個分岔路口...</div>
    <div class="button-container">
        <button onclick="makeChoice(1)">向左走</button>
        <button onclick="makeChoice(2)">向右走</button>
    </div>
</div>

<script>
    function makeChoice(choice) {
        const storyElement = document.getElementById('story');
        const buttonContainer = document.querySelector('.button-container');

        switch(choice) {
            case 1:
                storyElement.innerHTML = '你向左走,遇到了一隻巨大的熊!';
                buttonContainer.innerHTML = `
                        <button onclick="makeChoice(3)">逃跑</button>
                        <button onclick="makeChoice(4)">戰鬥</button>
                    `;
                break;

            case 2:
                storyElement.innerHTML = '你向右走,發現了一座古老的神廟。';
                buttonContainer.innerHTML = `
                        <button onclick="makeChoice(5)">進入神廟</button>
                        <button onclick="makeChoice(6)">繼續前進</button>
                    `;
                break;

            case 3:
                storyElement.innerHTML = '你成功逃脫了!但迷失在森林中...';
                buttonContainer.innerHTML = `
                        <button onclick="location.reload()">重新開始</button>
                    `;
                break;

            case 4:
                storyElement.innerHTML = '你勇敢地戰鬥,但不幸戰敗了。遊戲結束。';
                buttonContainer.innerHTML = `
                        <button onclick="location.reload()">重新開始</button>
                    `;
                break;

            case 5:
                storyElement.innerHTML = '你在神廟中找到了寶藏!你贏了!';
                buttonContainer.innerHTML = `
                        <button onclick="location.reload()">重新開始</button>
                    `;
                break;

            case 6:
                storyElement.innerHTML = '你繼續前進,最終找到了回家的路。';
                buttonContainer.innerHTML = `
                        <button onclick="location.reload()">重新開始</button>
                    `;
                break;
        }
    }
</script>
</body>
</html>
</title>
</head>
