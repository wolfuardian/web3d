<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>作品集 - Web3D Lab</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: system-ui, sans-serif;
            background: #0f0f1a;
            color: #eee;
            min-height: 100vh;
        }

        /* ── Nav ── */
        .nav {
            padding: 20px 48px;
            animation: fadeInUp 0.4s ease-out;
        }
        .nav a {
            color: #888;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.2s;
        }
        .nav a:hover { color: #6366f1; }

        /* ── Header ── */
        .header {
            padding: 24px 48px 48px;
            text-align: center;
            animation: fadeInUp 0.5s ease-out;
        }
        .header h1 {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }
        .header h1 .accent { color: #6366f1; }
        .header p {
            font-size: 15px;
            color: #888;
            line-height: 1.5;
        }

        /* ── Category Filter ── */
        .filters {
            display: flex;
            justify-content: center;
            gap: 12px;
            padding: 0 48px 32px;
            flex-wrap: wrap;
            animation: fadeInUp 0.6s ease-out;
        }
        .filter-btn {
            padding: 8px 20px;
            font-size: 13px;
            font-weight: 500;
            border: 1px solid #2a2a3e;
            border-radius: 20px;
            background: transparent;
            color: #888;
            cursor: pointer;
            transition: all 0.2s;
        }
        .filter-btn:hover {
            border-color: #6366f1;
            color: #eee;
        }
        .filter-btn.active {
            background: rgba(99, 102, 241, 0.15);
            border-color: #6366f1;
            color: #818cf8;
        }

        /* ── Works Grid ── */
        .works {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            max-width: 960px;
            margin: 0 auto;
            padding: 0 48px 64px;
        }

        .work-card {
            background: #1a1a2e;
            border: 1px solid #2a2a3e;
            border-radius: 16px;
            overflow: hidden;
            transition: transform 0.3s, border-color 0.3s, box-shadow 0.3s;
            animation: fadeInUp 0.6s ease-out both;
        }
        .work-card:hover {
            transform: translateY(-4px);
            border-color: #6366f1;
            box-shadow: 0 8px 32px rgba(99, 102, 241, 0.15);
        }

        .work-thumb {
            width: 100%;
            aspect-ratio: 16 / 10;
            background: #12121f;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .work-thumb svg {
            width: 48px;
            height: 48px;
            opacity: 0.3;
        }

        .work-info {
            padding: 20px;
        }
        .work-info h3 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 6px;
        }
        .work-info p {
            font-size: 13px;
            color: #888;
            line-height: 1.5;
        }
        .work-category {
            display: inline-block;
            font-size: 11px;
            padding: 3px 10px;
            background: rgba(99, 102, 241, 0.12);
            color: #818cf8;
            border-radius: 12px;
            font-weight: 500;
            margin-top: 12px;
        }

        /* ── Empty State ── */
        .empty {
            grid-column: 1 / -1;
            text-align: center;
            padding: 64px 24px;
            color: #555;
            font-size: 15px;
            display: none;
        }

        /* ── Footer ── */
        .footer {
            text-align: center;
            padding: 32px;
            font-size: 13px;
            color: #444;
        }

        /* ── Animation ── */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ── Responsive ── */
        @media (max-width: 600px) {
            .nav { padding: 16px 24px; }
            .header { padding: 16px 24px 32px; }
            .header h1 { font-size: 24px; }
            .filters { padding: 0 16px 24px; }
            .works {
                padding: 0 16px 48px;
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <nav class="nav">
        <a href="index.html">&larr; 返回首頁</a>
    </nav>

    <header class="header">
        <h1>作品<span class="accent">集</span></h1>
        <p>圖像作品、文字創作等個人作品展示</p>
    </header>

    <div class="filters">
        <button class="filter-btn active" data-filter="all">全部</button>
        <button class="filter-btn" data-filter="image">圖像作品</button>
        <button class="filter-btn" data-filter="text">文字作品</button>
    </div>

    <main class="works">
        <div class="work-card" data-category="image">
            <div class="work-thumb">
                <svg viewBox="0 0 24 24" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="18" height="18" rx="2"/>
                    <circle cx="8.5" cy="8.5" r="1.5"/>
                    <path d="M21 15l-5-5L5 21"/>
                </svg>
            </div>
            <div class="work-info">
                <h3>範例圖像作品</h3>
                <p>這是一個預留的範例卡片，替換為你的實際作品</p>
                <span class="work-category">圖像</span>
            </div>
        </div>

        <div class="work-card" data-category="text">
            <div class="work-thumb">
                <svg viewBox="0 0 24 24" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
                    <polyline points="14 2 14 8 20 8"/>
                    <line x1="16" y1="13" x2="8" y2="13"/>
                    <line x1="16" y1="17" x2="8" y2="17"/>
                </svg>
            </div>
            <div class="work-info">
                <h3>範例文字作品</h3>
                <p>這是一個預留的範例卡片，替換為你的實際作品</p>
                <span class="work-category">文字</span>
            </div>
        </div>

        <div class="empty">目前這個分類還沒有作品</div>
    </main>

    <footer class="footer">
        Built with vanilla HTML / CSS / JS
    </footer>

    <script>
        const buttons = document.querySelectorAll('.filter-btn');
        const cards = document.querySelectorAll('.work-card');
        const empty = document.querySelector('.empty');

        buttons.forEach(btn => {
            btn.addEventListener('click', () => {
                buttons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');

                const filter = btn.dataset.filter;
                let visibleCount = 0;

                cards.forEach(card => {
                    const match = filter === 'all' || card.dataset.category === filter;
                    card.style.display = match ? '' : 'none';
                    if (match) visibleCount++;
                });

                empty.style.display = visibleCount === 0 ? 'block' : 'none';
            });
        });
    </script>

</body>
</html>
